name: Gunner Time

on:
  schedule:
    # Every 15 minutes, offset from :00 when GitHub's scheduler is busiest and runs start late
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual runs

# Only one run at a time; a run that starts while a match is being followed waits its turn
concurrency:
  group: gunner-time
  cancel-in-progress: false

permissions:
  contents: write # lets the run commit state.json, the record of what's already been sent

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for Arsenal updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update bot state"
            git pull --rebase
            git push
          fi
